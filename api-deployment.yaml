apiVersion: apps/v1
kind: Deployment
metadata:
  name: synergychat-api
  labels:
    app: synergychat-api

spec:
  replicas: 1
  selector:
    matchLabels:
      app: synergychat-api

  template:
    metadata:
      labels:
        app: synergychat-api

    spec:
      containers:
        - name: synergychat-api
          image: bootdotdev/synergychat-api:latest
          env:
          - name: CRAWLER_BASE_URL
            value: "http://crawler-service.crawler.svc.cluster.local"
          # env:
          #   - name: API_PORT
          #     valueFrom:
          #       configMapKeyRef:
          #         name: synergychat-api-configmap
          #         key: API_PORT
          envFrom:
            - configMapRef:
                name: synergychat-crawler-configmap